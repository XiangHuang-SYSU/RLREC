# general settings
name: train_RLREC_S1_lcdp
model_type: RLRECS1Model
scale: 1
num_gpu: auto  # auto: can infer from your visible devices automatically. official: 8 GPUs
manual_seed: 0
find_unused_parameters: true

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: PairedDataset
    dataroot_gt: your-path/LCDP/lcdp_dataset_crop/train_crops_640/target_crops
    dataroot_lq: your-path/LCDP/lcdp_dataset_crop/train_crops_640/input_crops
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk


    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    gt_size: 640   # Max patch size
    minigt_sizes: 640

    # data loader
    use_shuffle: true
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
    name: ValSet
    type: PairedDataset
    dataroot_gt: your-path/LCDP/lcdp_dataset/test-gt
    dataroot_lq: your-path/LCDP/lcdp_dataset/test-input
    
    io_backend:
      type: disk

# network structures
network_g:
  type: RLRECS1
  inp_channels: 3
  out_channels: 3
  dim: 24
  num_blocks: [2,2,2,2]
  num_refinement_blocks: 2
  heads: [4,4,4,4]
  ffn_expansion_factor: 2
  bias: False
  LayerNorm_type: WithBias
  DINO_REPO_DIR: DINO/dinov3

# path
path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: MultiStepLR
    milestones: [200000,400000,800000]
    gamma: 0.5

  total_iter: 1100000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  

# Uncomment these for validation
# validation settings
val:
  val_freq: !!float 2e4
  save_img: False

  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim: # metric name
      type: calculate_ssim
      crop_border: 0
      test_y_channel: False

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500