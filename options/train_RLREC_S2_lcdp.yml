# general settings
name: train_RLREC_S2_lcdp
model_type: RLRECS2Model
scale: 1
num_gpu: auto  # auto: can infer from your visible devices automatically. official: 4 GPUs
manual_seed: 0
find_unused_parameters: true

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: PairedDataset
    dataroot_gt: your-path/LCDP/lcdp_dataset_crop/train_crops_640/target_crops
    dataroot_lq: your-path/LCDP/lcdp_dataset_crop/train_crops_640/input_crops
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    gt_size: 640   # Max patch size for progressive training
    minigt_sizes: 640

    # data loader
    use_shuffle: true
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
    name: ValSet
    type: PairedDataset
    dataroot_gt: your-path/LCDP/lcdp_dataset/test-gt
    dataroot_lq: your-path/LCDP/lcdp_dataset/test-input
    io_backend:
      type: disk

# network structures
network_g:
  type: RLRECS2
  inp_channels: 3
  out_channels: 3
  dim: 24
  num_blocks: [2,2,2,2]
  num_refinement_blocks: 2
  heads: [4,4,4,4]
  ffn_expansion_factor: 2
  bias: False
  LayerNorm_type: WithBias
  DINO_REPO_DIR: DINO/dinov3
  linear_start: 0.1
  linear_end: 0.99
  timesteps: 4

# network structures
network_S1:
  type: RLRECS1
  inp_channels: 3
  out_channels: 3
  dim: 24
  num_blocks: [2,2,2,2]
  num_refinement_blocks: 2
  heads: [4,4,4,4]
  ffn_expansion_factor: 2
  bias: False
  LayerNorm_type: WithBias
  DINO_REPO_DIR: DINO/dinov3

# path
path:
  pretrain_network_g: experiments/train_RLREC_S1_lcdp/models/net_g_300000.pth
  pretrain_network_S1: experiments/train_RLREC_S1_lcdp/models/net_g_300000.pth
  param_key_g: params_ema
  strict_load_g: False
  resume_state: ~
  ignore_resume_networks: network_S1

# training settings
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [50000]
    gamma: 0.1

  encoder_iter: 50001
  total_iter: 8000000
  warmup_iter: -1  # no warm up
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  dino_opt:
    type: DINOLoss
    loss_weight1: 0.1
    loss_weight2: 0.1
    DINO_REPO_DIR: DINO/dinov3
  
  prior_opt1:
    type: PriorLoss1
    loss_weight: 10.0

  prior_opt2:
    type: PriorLoss2
    loss_weight: 10.0


# validation settings
val:
  window_size: 8
  val_freq: !!float 5e3
  save_img: False

  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim: # metric name
      type: calculate_ssim
      crop_border: 0
      test_y_channel: False

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
